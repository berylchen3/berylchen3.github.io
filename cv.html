<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My CV</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            background-color: #ffffff;
            overflow: hidden;
        }

        h2 {
            color: #453cef;
            padding: 10px 20px;
            margin: 0;
        }

        .pdf-container {
            height: calc(100vh - 50px);
            width: 100%;
        }

        .pdf-container embed {
            width: 100%;
            height: 100%;
            border: none;
        }

        .back-to-home {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #522ca2;
            color: white;
            padding: 10px 24px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: 500;
            box-shadow: 0 4px 15px rgba(200, 123, 226, 0.4);
            transition: all 0.3s ease;
            z-index: 100;
        }

        .back-to-home:hover {
            background: #4235ee;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(123, 164, 226, 0.5);
        }
    </style>
</head>
<body>
    <h2>My CV</h2>
    <div class="pdf-container">
        <embed src="assets/my-cv.pdf" type="application/pdf">
    </div>
    <a href="index.html" class="back-to-home">Back to Home</a>
</body>
</html>
